<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcf8f6">
  <meta name="description" content="คู่มือ Venue Partner CHILL N’ KNOCK แบบพลิกหน้า">
  <title>Venue Partner Guide · CHILL N’ KNOCK</title>
  <link rel="stylesheet" href="runner-guide.css">
</head>
<body data-guide-role="venue">
  <div class="reader-app">
    <header class="topbar">
      <a class="back-link" href="#" onclick="window.close(); return false;" aria-label="กลับไป CHILL N’ KNOCK">
        <span class="back-arrow" aria-hidden="true">‹</span><span>กลับไปแอป</span>
      </a>
      <a id="pdfLink" class="pdf-link" href="venue-guide-original.pdf" hidden target="_blank" rel="noopener" title="เปิดคู่มือ PDF ต้นฉบับ">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v3h14v-3"/></svg>
        <span>PDF ต้นฉบับ</span>
      </a>
    </header>

    <main class="main">
      <div class="heading">
        <div class="heading-left">
          <p class="eyebrow">THE GUIDE TO YOUR NIGHT</p>
          <h1>คู่มือสำหรับ <em>Venue Partner</em></h1>
        </div>
        <label class="jump-label" for="pageJump"><span>ไปยังหน้า</span><select id="pageJump" aria-label="เลือกหน้าคู่มือ"></select></label>
      </div>

      <nav class="cnk-guide-role-tabs" aria-label="เลือกคู่มือบทบาท">
        <a class="cnk-guide-role-tab" href="guest-guide.html" onclick="location.replace(this.href);return false;"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>User</span></a>
        <a class="cnk-guide-role-tab" href="runner-guide.html" onclick="location.replace(this.href);return false;"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="16" cy="5" r="2"/><path d="m12 9 3-1 3 3 3 1M13 8l-3 5 4 3-3 5M10 13l-4 3-3 5"/></svg><span>Runner</span></a>
        <a class="cnk-guide-role-tab" href="venue-guide.html" aria-current="page" onclick="location.replace(this.href);return false;"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 5 4h14l2 6v11H3V10Z"/><path d="M3 10c0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0"/><path d="M9 21v-7h6v7"/></svg><span>Venue</span></a>
      </nav>

      <section class="reader-area" aria-label="คู่มือ Venue Partner แบบพลิกหน้า">
        <div class="book-ambience" aria-hidden="true"></div>
        <div class="book-wrapper">
          <div id="book" class="book" tabindex="0" role="group" aria-label="หน้าคู่มือ คลิกด้านซ้ายหรือขวาเพื่อพลิกหน้า หรือใช้ปุ่มลูกศร">
            <img id="currentPage" class="current-page" hidden src="" alt="คู่มือ Venue Partner หน้าแรก" draggable="false">
            <div id="turnLayer" class="turn-layer" hidden aria-hidden="true">
              <img id="underPage" class="under-page" alt="" draggable="false">
              <div class="static-half" id="staticHalf"><img id="staticImage" alt="" draggable="false"></div>
              <div id="flippingHalf" class="flipping-half">
                <div class="leaf-face leaf-front"><img id="frontImage" alt="" draggable="false"><span class="leaf-shade"></span></div>
                <div class="leaf-face leaf-back"><img id="backImage" alt="" draggable="false"><span class="leaf-shade"></span></div>
              </div>
            </div>
            <div id="guideEmpty" class="guide-empty" hidden>
              <div class="empty-icon" aria-hidden="true">▤</div>
              <h2 id="emptyTitle">กำลังเตรียมคู่มือ</h2>
              <p id="emptyDescription">กรุณาเพิ่มภาพหน้าคู่มือ</p>
            </div>
            <span class="paper-gloss" aria-hidden="true"></span>
            <div class="book-click-areas" aria-hidden="true"><div class="click-left" data-dir="prev"></div><div class="click-right" data-dir="next"></div></div>
          </div>
        </div>
        <div class="below-book"><span>CHILL N’ KNOCK · VENUE PARTNER</span><span class="paper-page" id="paperCount">— / —</span></div>
      </section>

      <nav class="control-panel" aria-label="ควบคุมการพลิกหน้า">
        <button type="button" class="nav-btn previous" id="prevPage" disabled><span aria-hidden="true">‹</span> หน้าก่อน</button>
        <div class="center-controls">
          <span id="pageIndicator" class="page-indicator" aria-live="polite">— <span>/ —</span></span>
          <div class="progress-track" role="progressbar" id="progressTrack" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1" aria-label="ความคืบหน้าคู่มือ"><div id="progressBar"></div></div>
        </div>
        <button type="button" class="nav-btn next" id="nextPage">หน้าถัดไป <span aria-hidden="true">›</span></button>
      </nav>

      <div class="reader-footer">
        <p>กดลูกศร <kbd>←</kbd> <kbd>→</kbd> หรือปัดซ้าย–ขวาเพื่อพลิกหน้า</p>
        <button type="button" class="zoom-button" id="openZoom" aria-label="ขยายหน้าคู่มือปัจจุบัน">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg> ขยายหน้าอ่าน
        </button>
      </div>
    </main>
  </div>

  <dialog id="zoomDialog" class="zoom-dialog" aria-label="ขยายอ่านหน้าคู่มือ">
    <div class="zoom-toolbar"><strong id="zoomTitle">Venue Partner Guide · หน้า 01</strong><div><button type="button" id="toggleZoom">ขยาย 2×</button><button type="button" class="zoom-close" id="closeZoom" aria-label="ปิด">✕</button></div></div>
    <div class="zoom-scroll"><img id="zoomImg" src="" alt="หน้าคู่มือแบบขยาย"></div>
  </dialog>
  <script src="runner-guide.js" defer></script>
</body>
</html>
