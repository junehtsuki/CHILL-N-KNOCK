function top(title,sub='',end=''){return `<div class="pagehead"><button class="back" onclick="goBack()">‹</button><h2>${title}${sub?`<div class="sub">${sub}</div>`:''}</h2>${end}</div>`}function goBack(){if(['venue','service'].includes(S.screen))nav('discover');else if(['booking','runners','confirm'].includes(S.screen))nav(S.screen==='booking'?'service':S.screen==='runners'?'booking':'runners');else if(['jobdetail','activejob'].includes(S.screen))nav('runnerhome');else nav(S.mode==='user'?'home':S.mode==='runner'?'runnerhome':'venuehome')}
function bottom(){let items=S.mode==='user'?[['home','home','Home'],['discover','compass','Discover'],['bookings','calendar','Bookings'],['messages','chat','Messages'],['profile','user','Profile']]:S.mode==='runner'?[['runnerhome','home','Home'],['jobs','briefcase','Jobs'],['activejob','clock','Active'],['earnings','wallet','Earnings'],['profile','user','Profile']]:[['venuehome','home','Home'],['requests','calendar','Bookings'],['queue','list','Queue'],['policies','settings','Policies'],['profile','user','Profile']];return `<nav class="nav">${items.map(([page,icon,label])=>`<button class="${S.screen===page?'active':''}" onclick="nav('${page}')">${ic(icon)}<span>${label}</span></button>`).join('')}</nav>`}
function welcome(){return `<section class="welcome"><img class="hero-img" src="${photos.hero}" alt="Nightlife ambiance"><div class="welcome-content"><div class="brand"><img src="${logo}" alt="CHILL N’ KNOCK">CHILL N’ KNOCK</div><div class="welcome-center"><div class="eyebrow">Bangkok nights, reimagined</div><h1>Your night.<br>Your way.</h1><p>Discover the places worth going. Book ahead or let a Table Runner help with the queue.</p><div class="dots"><i></i><i></i><i></i></div><div class="welcome-actions"><button class="primary full" onclick="nav('onboard')">Explore the night &nbsp; →</button><button class="outline full" onclick="nav('onboard')">Log in / Create account</button></div><div class="small-note">A concept prototype · No real reservations</div></div></div></section>`}
function onboard(){return `<section class="screen" style="background:#170e10;color:white;padding:55px 26px 30px"><img src="${logo}" style="width:64px;height:64px;border-radius:17px;margin-bottom:30px"><div class="eyebrow">Welcome to CHILL N’ KNOCK</div><h1 style="font:600 41px/1.13 'Playfair Display',serif;margin:14px 0 9px">A better way<br>to go out.</h1><p style="color:#cbb5b2;font-size:12px;line-height:1.8">Choose how you'd like to explore our prototype.</p><div style="margin-top:28px"><button class="service" onclick="enter('user')"><div class="round-icon">${ic('sparkle')}</div><div><strong>I'm going out</strong><p>Find venues, book tables and request queue help</p></div><span class="tick">→</span></button><button class="service" onclick="enter('runner')"><div class="round-icon">${ic('briefcase')}</div><div><strong>I'm a Table Runner</strong><p>Explore available jobs and track progress</p></div><span class="tick">→</span></button><button class="service" onclick="enter('venue')"><div class="round-icon">${ic('shield')}</div><div><strong>I'm a venue partner</strong><p>Manage bookings, queues and service policies</p></div><span class="tick">→</span></button></div><p class="small-note" style="margin-top:24px">Prototype mode · You can switch roles later</p></section>`}
function enter(mode){S.mode=mode;nav(mode==='user'?'home':mode==='runner'?'runnerhome':'venuehome')}
function home(){return `<section class="screen"><div class="topbar"><div class="mini-brand"><img src="${logo}"> CHILL N’ KNOCK</div><button class="iconbtn" onclick="nav('profile')">${ic('user')}</button></div><div class="content"><p class="greeting">FRIDAY FEELS · BANGKOK</p><h1 class="bigtitle">Where to <em>tonight?</em></h1><div class="search" onclick="nav('discover')">${ic('search')}<span style="font-size:12px">Search bars, clubs, or areas...</span></div><div class="chips">${['All','Bar','Club','Live Music','Rooftop'].map(x=>`<button class="chip ${S.filter===x?'active':''}" onclick="set({filter:'${x}',screen:'discover'})">${x}</button>`).join('')}</div><div class="feature" onclick="nav('venue',{venue:1})" style="cursor:pointer"><img src="${photos.club}" alt="Nightlife venue"><div class="overlay"><span class="tag">✦ TONIGHT'S PICK</span><h3>Own the night.</h3><p>Curated places, unforgettable moments. &nbsp; →</p></div></div><div class="section-heading"><h2>Make it a good night</h2></div><div class="quick-grid"><button class="quick" onclick="nav('discover')"><div class="round-icon">${ic('compass')}</div><strong>Discover places</strong><span>Find your next favorite</span><span class="arrow">↗</span></button><button class="quick" onclick="nav('bookings')"><div class="round-icon">${ic('calendar')}</div><strong>My night plans</strong><span>Track your requests</span><span class="arrow">↗</span></button></div><div class="section-heading"><h2>Popular after dark</h2><button class="linkbtn" onclick="nav('discover')">See all →</button></div><div class="horizontal">${venues.map(v=>`<article class="venue-card" onclick="nav('venue',{venue:${v.id}})" style="cursor:pointer"><img src="${v.image}" alt="${v.name}"><div class="body"><h3>${v.name}</h3><p>${v.area}</p><p style="margin-top:7px"><span class="rating">★ ${v.rating}</span> &nbsp; · &nbsp; ${v.type}</p></div></article>`).join('')}</div><div class="section-heading"><h2>Less waiting. More living.</h2></div><div class="banner"><div><span class="eyebrow" style="color:#f4d0b2">TABLE RUNNER</span><h3>Skip the hassle.</h3><p>Get help booking or queueing*</p></div><button onclick="nav('discover')">Explore →</button></div><p class="caption" style="margin:12px 0">*Available only where venue policies permit. No guaranteed table or queue transfer.</p></div></section>`}
function discover(){let filtered=venues.filter(v=>(S.filter==='All'||v.type===S.filter||v.tags.includes(S.filter))&&(v.name+' '+v.area+' '+v.tags.join(' ')).toLowerCase().includes(S.query.toLowerCase()));return `<section class="screen">${top('Discover','Explore Bangkok after dark')}<div class="content"><div class="search">${ic('search')}<input placeholder="Search venues, music, neighborhoods" value="${esc(S.query)}" oninput="S.query=this.value;updateResults()"></div><div class="chips">${['All','Bar','Club','Live Music','Rooftop'].map(x=>`<button class="chip ${S.filter===x?'active':''}" onclick="set({filter:'${x}'})">${x}</button>`).join('')}</div><div class="section-heading" style="margin-top:5px"><h2>Places to explore</h2><span class="tiny muted">${filtered.length} venues</span></div><div id="venue-results">${venueResults(filtered)}</div></div></section>`}
function venueResults(list){return list.length?list.map(v=>`<div class="card listvenue" onclick="nav('venue',{venue:${v.id}})" style="cursor:pointer"><img src="${v.image}" alt="${v.name}"><div style="flex:1"><h3>${v.name}</h3><p>${v.area}</p><p>${v.type} · <span class="rating">★ ${v.rating}</span></p><span class="tag dark">${v.event}</span></div><span class="go">›</span></div>`).join(''):'<div class="empty">No venues match your search.</div>'}function updateResults(){let filtered=venues.filter(v=>(S.filter==='All'||v.type===S.filter||v.tags.includes(S.filter))&&(v.name+' '+v.area+' '+v.tags.join(' ')).toLowerCase().includes(S.query.toLowerCase()));let el=document.getElementById('venue-results');if(el)el.innerHTML=venueResults(filtered)}
function venue(){let v=V(),fav=S.favorites.includes(v.id);return `<section class="screen"><div class="venue-hero"><img src="${v.image}" alt="${v.name}"><button class="floatback" onclick="nav('discover')">‹</button><button class="floatfav" onclick="toggleFav(${v.id})">${fav?'♥':'♡'}</button></div><div class="venue-info"><div class="kicker">${v.type} · ${v.area}</div><h1>${v.name}</h1><div class="pillrow"><span class="pill">★ ${v.rating} guest rating</span><span class="pill">${v.area}</span><span class="pill">Open evenings*</span></div><p>${v.desc}</p><div class="pillrow">${v.tags.map(x=>`<span class="pill">${x}</span>`).join('')}</div><div class="divider"></div><div class="section-heading"><h2>Coming up</h2></div><div class="card" style="display:flex;gap:13px;align-items:center"><img src="${photos.event}" style="width:80px;height:76px;border-radius:11px"><div><strong style="font-size:13px">${v.event}</strong><p class="caption">An evening worth remembering</p><span class="tag dark">EVENT PREVIEW</span></div></div><div class="section-heading"><h2>How would you like to go?</h2></div><button class="service" onclick="nav('service')"><div class="round-icon">${ic('calendar')}</div><div><strong>Book a table / Get in line</strong><p>Choose a service and review venue conditions</p></div><span class="tick">→</span></button><div class="notice">Venue details, prices, events and availability shown here are illustrative. Runner services depend on venue approval and do not guarantee entry or a table.</div><button class="primary full" onclick="nav('service')">Plan my night →</button></div></section>`}
function toggleFav(id){S.favorites=S.favorites.includes(id)?S.favorites.filter(x=>x!==id):[...S.favorites,id];save();render()}
function service(){return `<section class="screen">${top('Choose your service','Step 1 of 4')}<div class="stepper"><i class="done"></i><i></i><i></i><i></i></div><div class="content"><div class="kicker">YOUR NIGHT AT ${V().name.toUpperCase()}</div><h1 class="bigtitle" style="margin-top:8px">How can we <em>help?</em></h1><p class="caption" style="margin-bottom:20px">Select the kind of help you need. Both services are subject to venue rules.</p><button class="service ${S.service==='booking'?'selected':''}" onclick="set({service:'booking'})"><div class="round-icon">${ic('calendar')}</div><div><strong>Book a table</strong><p>Request help contacting the venue and arranging an advance reservation.</p></div><span class="tick">${S.service==='booking'?'●':'○'}</span></button><button class="service ${S.service==='queue'?'selected':''}" onclick="set({service:'queue'})"><div class="round-icon">${ic('people')}</div><div><strong>Get in line (Walk-in)</strong><p>Ask a runner to queue on your behalf, only if the venue permits it.</p></div><span class="tick">${S.service==='queue'?'●':'○'}</span></button><div class="notice">Important: A runner cannot guarantee a table, entry, or transfer of queue rights. The venue makes the final decision.</div><div style="height:40px"></div><button class="primary full" onclick="nav('booking')">Continue →</button></div></section>`}
function booking(){const dates=['Today','Tomorrow','Fri','Sat'];return `<section class="screen">${top(S.service==='booking'?'Table request':'Walk-in request','Step 2 of 4')}<div class="stepper"><i class="done"></i><i class="done"></i><i></i><i></i></div><div class="content"><span class="kicker">${V().name}</span><h1 class="bigtitle" style="font-size:29px;margin-top:8px">Set the <em>details.</em></h1><label class="field-label">When are you going?</label><div class="dategrid">${dates.map((d,i)=>`<button class="dateopt ${S.date===i?'active':''}" onclick="set({date:${i}})">${d}<strong>${16+i}</strong></button>`).join('')}</div><label class="field-label">Preferred arrival time</label><div class="choicegrid">${['19:00','20:00','21:00','22:00','23:00','00:00'].map(t=>`<button class="choice ${S.time===t?'active':''}" onclick="set({time:'${t}'})">${t}</button>`).join('')}</div><label class="field-label">Number of guests</label><div class="countbox"><span class="caption">Including you</span><div style="display:flex;align-items:center;gap:19px"><button onclick="set({guests:Math.max(1,S.guests-1)})">−</button><strong>${S.guests}</strong><button onclick="set({guests:Math.min(20,S.guests+1)})">+</button></div></div>${S.service==='booking'?`<label class="field-label">Seating preference</label><div class="choicegrid">${['Standard','VIP','Outdoor'].map(x=>`<button class="choice ${S.seat===x?'active':''}" onclick="set({seat:'${x}'})">${x}</button>`).join('')}</div>`:`<div class="notice">For Walk-in requests, the runner must first verify whether the venue permits queueing on behalf of someone else. No queue position is promised.</div>`}<label class="field-label">Special request (optional)</label><textarea id="special" class="field fieldarea" placeholder="Anything the runner should know?"></textarea><div style="height:15px"></div><button class="primary full" onclick="S.special=document.getElementById('special').value;nav('runners')">Find a Table Runner →</button></div></section>`}
function runners(){return `<section class="screen">${top('Choose a runner','Step 3 of 4')}<div class="stepper"><i class="done"></i><i class="done"></i><i class="done"></i><i></i></div><div class="content"><h1 class="bigtitle" style="font-size:30px">A little help,<br><em>a better night.</em></h1><p class="caption">Illustrative runner profiles and service fees. No real availability or matching is provided.</p>${[{id:1,name:'Nina S.',rating:'4.9',jobs:'120 sample jobs',price:350,img:photos.avatar},{id:2,name:'Mark T.',rating:'4.8',jobs:'86 sample jobs',price:320,img:photos.avatar2}].map(r=>`<div class="runner-row ${S.runner===r.id?'active':''}" onclick="set({runner:${r.id}})"><img class="avatar" src="${r.img}"><div><strong>${r.name}</strong><p>★ ${r.rating} · ${r.jobs}</p><span class="tag dark">Runner profile · Demo</span></div><div class="price">฿${r.price}<div style="text-align:right;font-size:16px;margin-top:6px">${S.runner===r.id?'◉':'○'}</div></div></div>`).join('')}<div class="notice">The runner must confirm job details and the venue's permission before proceeding. Any displayed fee is for prototype demonstration only.</div><button class="primary full" onclick="nav('confirm')">Review request →</button></div></section>`}
function confirm(){return `<section class="screen">${top('Review request','Step 4 of 4')}<div class="stepper"><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i></div><div class="content"><h1 class="bigtitle" style="font-size:30px">Almost <em>there.</em></h1><div class="card"><div class="listvenue"><img src="${V().image}" style="height:72px;width:76px"><div><h3>${V().name}</h3><p>${V().area}</p><span class="tag dark">${S.service==='booking'?'Advance booking assistance':'Walk-in queue assistance'}</span></div></div><div class="divider"></div>${[['Preferred date',['Today','Tomorrow','Fri','Sat'][S.date]],['Arrival time',S.time],['Guests',S.guests+' people'],['Runner',S.runner===1?'Nina S.':'Mark T.'],['Illustrative runner fee',S.runner===1?'฿350':'฿320']].map(([a,b])=>`<div style="display:flex;justify-content:space-between;margin:12px 0;font-size:12px"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="notice">This creates a demo request only. No venue booking, queue right, runner assignment, or payment is made. Final confirmation must come from the venue.</div><button class="primary full" onclick="submitRequest()">Submit demo request →</button></div></section>`}
function submitRequest(){let id='CK-'+String(Date.now()).slice(-6);S.requests.unshift({id,venue:V().name,venueId:V().id,service:S.service,date:S.date,time:S.time,guests:S.guests,runner:S.runner,status:'Request submitted',created:Date.now()});save();nav('submitted')}
function submitted(){let r=S.requests[0];return `<section class="screen">${top('Request submitted')}<div class="content"><div class="success-hero"><div class="success-circle">${ic('check')}</div><div class="kicker">DEMO REQUEST CREATED</div><h1>You're on your way.</h1><p class="caption">Your request is saved in this browser for testing.</p></div><div class="card"><strong style="font-size:14px">${r?.venue||'Your venue'}</strong><p class="caption">Reference ${r?.id||'—'} · ${r?.service==='queue'?'Walk-in queue':'Advance booking'} assistance</p><div class="divider"></div>${statusRows()}</div><div class="notice">This is not a confirmed reservation. In a real service, the runner and venue must separately verify the request.</div><button class="primary full" onclick="nav('bookings')">View my requests →</button><button class="outline full" style="margin-top:10px" onclick="nav('home')">Back to home</button></div></section>`}
function statusRows(){return [['Request submitted','Saved in prototype'],['Runner accepts','Awaiting real matching'],['Venue confirms conditions','Requires venue verification'],['Table / queue outcome','Not guaranteed']].map((a,i)=>`<div class="statusline ${i===0?'done':''}"><div class="bullet">${i===0?'✓':i+1}</div><div><strong>${a[0]}</strong><p>${a[1]}</p></div></div>`).join('')}
function bookings(){return `<section class="screen">${top('My night plans','Requests & status')}<div class="content"><h1 class="bigtitle" style="font-size:30px">Your <em>plans.</em></h1>${S.requests.length?S.requests.map((r,i)=>`<div class="card" onclick="nav('requestdetail',{requestIndex:${i}})" style="cursor:pointer"><span class="tag dark">${r.status}</span><h3 style="font-size:16px;margin:12px 0 5px">${r.venue}</h3><p class="caption">${r.service==='queue'?'Walk-in queue assistance':'Advance booking assistance'} · ${r.time} · ${r.guests} guests</p><div class="divider"></div><span class="caption">${r.id}</span><span style="float:right;color:var(--wine);font-size:12px;font-weight:800">View details →</span></div>`).join(''):`<div class="empty"><div class="large">No plans yet.</div>Find a venue and start planning your night.<br><br><button class="primary" onclick="nav('discover')">Explore venues</button></div>`}</div></section>`}
function requestdetail(){let r=S.requests[S.requestIndex||0];if(!r)return bookings();return `<section class="screen">${top('Request details',r.id)}<div class="content"><div class="card"><strong>${r.venue}</strong><p class="caption">${r.service==='queue'?'Walk-in queue':'Advance booking'} · ${r.time} · ${r.guests} guests</p><div class="divider"></div>${statusRows()}</div><div class="notice">Current status is a prototype placeholder. It does not indicate that a venue or runner has accepted the request.</div><button class="outline full" onclick="nav('messages')">Open demo messages</button><button class="outline full" style="margin-top:10px;color:var(--wine)" onclick="cancelRequest('${r.id}')">Cancel demo request</button></div></section>`}function cancelRequest(id){S.requests=S.requests.filter(x=>x.id!==id);save();nav('bookings')}
function messages(){return `<section class="screen">${top('Messages','Demo conversation')}<div class="content"><div class="card" style="display:flex;align-items:center;gap:12px"><img src="${photos.avatar}" class="avatar"><div><strong style="font-size:13px">Nina · Table Runner</strong><p class="caption">Prototype chat · Not connected to a real person</p></div></div><div class="message-list">${S.messages.map(m=>`<div class="bubble ${m.me?'me':''}">${esc(m.text)}</div>`).join('')}</div><div class="chatbar"><input class="field" id="chatinput" placeholder="Write a message..."><button class="primary" onclick="sendChat()">Send</button></div></div></section>`}function sendChat(){let el=document.getElementById('chatinput');if(!el||!el.value.trim())return;S.messages.push({me:true,text:el.value.trim()});render()}
function profile(){return `<section class="screen"><div class="profilehead"><div class="mini-brand" style="display:flex;gap:10px;align-items:center"><img src="${logo}" style="width:40px;height:40px;border-radius:12px"> CHILL N’ KNOCK</div><h2>Make every night yours.</h2><p>Prototype account · ${S.mode==='user'?'Nightlife User':S.mode==='runner'?'Table Runner':'Venue Partner'}</p></div><div class="content" style="padding-top:20px"><span class="kicker">SWITCH EXPERIENCE</span><div class="modebar" style="padding:12px 0 20px">${[['user','Nightlife User'],['runner','Table Runner'],['venue','Venue Partner']].map(([m,n])=>`<button class="${S.mode===m?'active':''}" onclick="enter('${m}')">${n}</button>`).join('')}</div>${[['heart','Saved venues','favorites'],['calendar','My requests','bookings'],['chat','Messages','messages'],['shield','Prototype information','about']].map(([ico,n,page])=>`<button class="menurow" style="width:100%;text-align:left" onclick="nav('${page}')">${ic(ico)} ${n}<span class="chev">›</span></button>`).join('')}<button class="menurow" style="width:100%;text-align:left;color:var(--wine)" onclick="nav('welcome')">${ic('arrow')} Back to welcome <span class="chev">›</span></button><p class="caption" style="text-align:center;margin-top:20px">CHILL N’ KNOCK · UX concept v2</p></div></section>`}
function favorites(){return `<section class="screen">${top('Saved venues')}<div class="content"><h1 class="bigtitle">Your <em>favorites.</em></h1>${S.favorites.length?venueResults(venues.filter(v=>S.favorites.includes(v.id))):'<div class="empty">Tap the heart on a venue to save it here.</div>'}</div></section>`}
function about(){return `<section class="screen">${top('About this prototype')}<div class="content"><h1 class="bigtitle">Good nights,<br><em>less wait.</em></h1><div class="card"><strong>What works in this demo?</strong><p class="caption">Screen navigation, venue discovery, favorites, booking and queue request flows, demo status, messages, runner job steps, and venue policies.</p><div class="divider"></div><strong>What is not live?</strong><p class="caption">Authentication, payments, real-time venue inventory, maps, booking confirmations, runner verification, cross-account messaging and backend syncing.</p></div><button class="outline full" onclick="resetDemo()">Reset saved demo data</button></div></section>`}function resetDemo(){localStorage.removeItem('cnk_v2');S.requests=[];S.favorites=[];S.policies={booking:true,queue:false,verification:true};nav('welcome')}
function runnerhome(){return `<section class="screen">${top('Runner dashboard','Your side of the night')}<div class="content"><div class="kicker">RUNNER MODE · DEMO</div><h1 class="bigtitle" style="margin-top:8px">Ready to <em>roll?</em></h1><div class="jobhero"><div class="eyebrow">POTENTIAL EARNINGS · DEMO</div><div class="money">฿1,250</div><p>Explore sample opportunities on your schedule.</p></div><div class="metricrow"><div class="metric"><strong>03</strong><span>Available jobs</span></div><div class="metric"><strong>4.9</strong><span>Sample rating</span></div><div class="metric"><strong>98%</strong><span>Demo completion</span></div></div><div class="section-heading"><h2>Available tonight</h2><button class="linkbtn" onclick="nav('jobs')">See all →</button></div>${jobCards(true)}<div class="notice">Runner verification, fees and job availability are examples only. No real jobs are posted.</div></div></section>`}
const jobs=[{id:1,venue:'Sugar Club',type:'Walk-in queue help',area:'RCA',fee:350,desc:'Queue for 4 guests. Check venue permission before starting.',time:'Before 21:00'},{id:2,venue:'The Velvet Room',type:'Advance booking assistance',area:'Thonglor',fee:450,desc:'Contact venue and request table for 3 guests.',time:'Tonight 20:00'},{id:3,venue:'Afterglow',type:'Advance booking assistance',area:'Sukhumvit',fee:300,desc:'Check availability and provide booking confirmation details.',time:'Tomorrow 19:00'}];
function jobCards(short=false){return (short?jobs.slice(0,2):jobs).map(j=>`<div class="jobcard"><div class="head"><strong>${j.venue}</strong><span class="amt">฿${j.fee}</span></div><p>${j.type} · ${j.area}<br>${j.desc}<br>${j.time}</p><button class="primary" onclick="nav('jobdetail',{job:${j.id}})">View job →</button></div>`).join('')}
function jobsPage(){return `<section class="screen">${top('Find jobs','Sample jobs nearby')}<div class="content"><h1 class="bigtitle">Your next <em>gig.</em></h1>${jobCards()}<div class="notice">Accepting a demo job only changes this browser's interface; it does not notify a customer or venue.</div></div></section>`}
function jobdetail(){let j=jobs.find(x=>x.id===S.job)||jobs[0];return `<section class="screen">${top('Job details','Review before accepting')}<div class="content"><div class="jobhero"><div class="eyebrow">${j.type}</div><h1 style="font:600 32px 'Playfair Display',serif;margin:12px 0">${j.venue}</h1><p>${j.area} · ${j.time}</p><div class="money">฿${j.fee}</div><p>Illustrative service fee</p></div><div class="card"><strong>What you'll do</strong><p class="caption">${j.desc}</p><div class="divider"></div><strong>Before accepting</strong><p class="caption">Confirm venue rules, expected wait, travel costs, customer requirements and how progress will be verified.</p></div><div class="notice">Do not queue or make reservations on someone else's behalf without permission from the venue.</div><button class="primary full" onclick="S.activeJob=j.id;S.progress=0;nav('activejob')">Accept demo job →</button></div></section>`}
function activejob(){let j=jobs.find(x=>x.id===S.activeJob);if(!j)return `<section class="screen">${top('Active job')}<div class="content"><div class="empty"><div class="large">All clear.</div>No active demo job right now.<br><br><button class="primary" onclick="nav('jobs')">Browse jobs</button></div></div></section>`;let steps=['Job accepted','Arrived at venue','Venue policy checked','Progress updated','Job marked complete'];return `<section class="screen">${top('Active job','Demo progress tracker')}<div class="content"><div class="jobhero"><span class="eyebrow">CURRENT DEMO JOB</span><h1 style="font:600 30px 'Playfair Display',serif;margin:10px 0">${j.venue}</h1><p>${j.type} · ${j.area}</p></div><div class="card">${steps.map((s,i)=>`<div class="statusline ${i<=S.progress?'done':''}"><div class="bullet">${i<=S.progress?'✓':i+1}</div><div><strong>${s}</strong><p>${i<=S.progress?'Demo step recorded':'Not yet completed'}</p></div></div>`).join('')}</div>${S.progress<4?`<button class="primary full" onclick="S.progress++;render()">${['Mark arrival','Confirm policy check','Update progress','Mark job complete'][S.progress]} →</button>`:`<div class="notice">Demo job completed. This is not proof of a real reservation or queue transfer.</div><button class="primary full" onclick="S.activeJob=null;nav('earnings')">View demo earnings →</button>`}</div></section>`}
function earnings(){return `<section class="screen">${top('Earnings','Illustrative runner dashboard')}<div class="content"><h1 class="bigtitle">Your <em>earnings.</em></h1><div class="jobhero"><div class="eyebrow">SAMPLE WEEKLY EARNINGS</div><div class="money">฿2,850</div><p>Illustrative figures — no payments are processed.</p></div><div class="section-heading"><h2>Example activity</h2></div>${jobs.map(j=>`<div class="menurow"><div style="flex:1">${j.venue}<div class="caption">${j.type}</div></div><strong style="color:var(--wine)">฿${j.fee}</strong></div>`).join('')}</div></section>`}
function venuehome(){return `<section class="screen">${top('Venue dashboard','Partner prototype')}<div class="content"><div class="kicker">PARTNER MODE</div><h1 class="bigtitle" style="margin-top:8px">Run your <em>night.</em></h1><div class="jobhero"><div class="eyebrow">SUGAR CLUB · DEMO VENUE</div><h2 style="font:600 27px 'Playfair Display',serif;margin:12px 0">Good evening, team.</h2><p>Keep bookings, queue rules and runner requests in one place.</p></div><div class="metricrow"><div class="metric"><strong>12</strong><span>Sample bookings</span></div><div class="metric"><strong>08</strong><span>Sample queue</span></div><div class="metric"><strong>03</strong><span>Demo runners</span></div></div><div class="section-heading"><h2>Quick management</h2></div><div class="quick-grid"><button class="quick" onclick="nav('requests')"><div class="round-icon">${ic('calendar')}</div><strong>Booking requests</strong><span>Review & respond</span></button><button class="quick" onclick="nav('queue')"><div class="round-icon">${ic('people')}</div><strong>Walk-in queue</strong><span>Manage venue policy</span></button><button class="quick" onclick="nav('policies')"><div class="round-icon">${ic('shield')}</div><strong>Service rules</strong><span>Set permissions</span></button><button class="quick" onclick="nav('analytics')"><div class="round-icon">${ic('sparkle')}</div><strong>Insights</strong><span>Example metrics</span></button></div><div class="notice">Venue tools are illustrative and not connected to any business or booking system.</div></div></section>`}
function requests(){return `<section class="screen">${top('Booking requests','Venue demo')}<div class="content"><h1 class="bigtitle">Tonight's <em>requests.</em></h1>${[{name:'Demo guest · CK-001',guests:4,time:'21:00',type:'Advance booking'},{name:'Demo guest · CK-002',guests:2,time:'22:00',type:'Advance booking'},{name:'Demo guest · CK-003',guests:5,time:'20:30',type:'Walk-in enquiry'}].map((r,i)=>`<div class="jobcard"><div class="head"><strong>${r.name}</strong><span class="tag dark">${r.type}</span></div><p>${r.guests} guests · ${r.time}<br><span id="venue-status-${i}">Status: Pending demo review</span></p><div style="display:flex;gap:8px"><button class="primary" onclick="document.getElementById('venue-status-${i}').textContent='Status: Demo approved';notify('Demo request approved')">Approve demo</button><button class="outline" style="padding:10px" onclick="document.getElementById('venue-status-${i}').textContent='Status: Demo declined';notify('Demo request declined')">Decline</button></div></div>`).join('')}<div class="notice">Actions here only update demo labels on this screen. They do not approve real customer requests.</div></div></section>`}
function queue(){return `<section class="screen">${top('Queue management','Venue demo')}<div class="content"><h1 class="bigtitle">At the <em>door.</em></h1><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><strong>Walk-in queue</strong><p class="caption">Example waitlist · 8 groups</p></div><span class="tag dark">DEMO</span></div></div>${[1,2,3,4].map((n)=>`<div class="menurow"><div style="width:35px;height:35px;border-radius:10px;background:#f6e9e6;color:var(--wine);display:grid;place-items:center;font-weight:900">#${n}</div><div style="flex:1">Sample party ${n}<div class="caption">${n+1} guests · Walk-in</div></div><span class="caption">Waiting</span></div>`).join('')}<button class="outline full" onclick="notify('Demo queue refreshed')">Refresh demo queue</button></div></section>`}
function policies(){return `<section class="screen">${top('Venue policies','Set sample service permissions')}<div class="content"><h1 class="bigtitle">House <em>rules.</em></h1><p class="caption">In the real service, each venue must explicitly set and confirm these policies.</p><div class="card">${[['booking','Allow booking assistance','A third party may contact the venue to request a reservation.'],['queue','Allow Walk-in queue assistance','A runner may queue on behalf of another guest if the venue permits.'],['verification','Require customer verification','Check guest identity before confirming or transferring any rights.']].map(([key,name,desc])=>`<div class="policyrow"><div style="flex:1"><strong>${name}</strong><p>${desc}</p></div><button class="switch ${S.policies[key]?'on':''}" aria-label="Toggle ${name}" onclick="togglePolicy('${key}')"></button></div>`).join('')}</div><div class="notice">These switches save only to this browser. They do not represent actual venue permission, including for the sample venues shown elsewhere.</div></div></section>`}function togglePolicy(key){S.policies[key]=!S.policies[key];save();render()}
function analytics(){return `<section class="screen">${top('Insights','Sample partner analytics')}<div class="content"><h1 class="bigtitle">Nightly <em>insights.</em></h1><div class="metricrow"><div class="metric"><strong>124</strong><span>Sample requests</span></div><div class="metric"><strong>56</strong><span>Sample approvals</span></div><div class="metric"><strong>8m</strong><span>Sample response</span></div></div><div class="card" style="margin-top:15px"><strong>Requests by day · Illustrative</strong><div style="height:180px;display:flex;align-items:end;gap:13px;padding:20px 6px 5px">${[42,63,50,84,75,96,67].map((h,i)=>`<div style="flex:1;text-align:center"><div style="height:${h*1.35}px;border-radius:7px 7px 2px 2px;background:${i===5?'#851c2b':'#e5c5be'}"></div><span class="caption">${['M','T','W','T','F','S','S'][i]}</span></div>`).join('')}</div></div><div class="notice">All numbers on this page are fictional examples for UI evaluation.</div></div></section>`}
function esc(str){return String(str||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const pages={welcome,onboard,home,discover,venue,service,booking,runners,confirm,submitted,bookings,requestdetail,messages,profile,favorites,about,runnerhome,jobs:jobsPage,jobdetail,activejob,earnings,venuehome,requests,queue,policies,analytics};const fn=pages[S.screen]||home;document.getElementById('app').innerHTML=fn()+(S.screen==='welcome'||S.screen==='onboard'?'':bottom())+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');}
render();
</script></body></html>
