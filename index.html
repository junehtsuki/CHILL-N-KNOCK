function save(){localStorage.setItem('cnk-prototype',JSON.stringify(S))}function update(obj){Object.assign(S,obj);save();render()}function nav(page){S.page=page;save();render();window.scrollTo({top:0,behavior:'smooth'})}function notice(text){let e=document.querySelector('.toast');if(e)e.remove();e=document.createElement('div');e.className='toast';e.textContent=text;document.body.appendChild(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),3600)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '฿'+Number(n).toLocaleString('th-TH')}function venue(id){return venues.find(v=>v.id===Number(id))||venues[0]}function currentReq(){return S.requests[0]}function btn(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}function pageHead(k,title,sub='',right=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${title}</h1>${sub?`<div class="muted">${sub}</div>`:''}</div>${right}</div>`}function venueCard(v){return `<div class="card"><div class="venue-cover" style="background-image:url('${v.img}')"><span class="tag">${v.live?'● Live tonight':v.type}</span></div><div class="venue-info"><h3>${v.name}</h3><div class="meta">${ic('location',13)} ${v.area} · ${v.type} · ★ ${v.rating}</div><div class="venue-foot"><span class="price">From ${money(v.price)}</span>${btn('View '+ic('arrow',13),`update({venue:${v.id},page:'detail'})`,'small')}</div></div></div>`}function runnerCard(r,select=false){return `<div class="runner-card"><div class="runner-face">${r.initial}</div><div class="grow"><strong>${r.name} <span style="color:#aa7a37">★ ${r.rating}</span></strong><small>${r.jobs} completed jobs · ${r.area}</small></div><div style="text-align:right"><strong>${money(r.fee)}</strong>${select?`<div style="margin-top:7px">${btn(S.runner===r.id?'Selected':'Select',`update({runner:${r.id}})`,'small '+(S.runner===r.id?'':'outline'))}</div>`:''}</div></div>`}
function userHome(){return `<div class="hero"><div><div class="eyebrow" style="color:#e4b98d">BANGKOK NIGHTLIFE · ALL IN ONE</div><h1>Good nights<br>start here.</h1><p>Discover venues, book a table, or get help with the walk-in queue. Your night out, handled.</p>${btn('Explore venues '+ic('arrow'),"nav('discover')")}</div><img class="hero-logo" src="logo.png" alt="CHILL N KNOCK"></div><div class="section-title">Make tonight yours <span>เลือกสิ่งที่ต้องการ</span></div><div class="grid"><div class="card service-card"><div class="service-icon">${ic('discover',25)}</div><h3>Discover venues</h3><p>ค้นหาร้านจากพื้นที่ ประเภท และบรรยากาศ</p>${btn('Explore',"nav('discover')",'outline small')}</div><div class="card service-card"><div class="service-icon">${ic('calendar',25)}</div><h3>Book a table</h3><p>ส่งคำขอช่วยจองล่วงหน้าตามเงื่อนไขร้าน</p>${btn('Book now',"update({service:'booking',page:'discover'})",'outline small')}</div><div class="card service-card"><div class="service-icon">${ic('queue',25)}</div><h3>Get in line</h3><p>ขอคนช่วยต่อคิว Walk-in เฉพาะร้านที่อนุญาต</p>${btn('Find a runner',"update({service:'queue',page:'discover'})",'outline small')}</div></div><div class="section-title">Popular tonight <span onclick="nav('discover')" style="cursor:pointer">See all →</span></div><div class="grid">${venues.slice(0,3).map(venueCard).join('')}</div><div class="section-title">This week’s events</div><div class="grid">${venues.slice(0,3).map(v=>`<div class="card pad"><span class="tag">UPCOMING</span><h3>${v.event}</h3><p class="muted">${v.name} · ${v.area}</p>${btn('Venue details',`update({venue:${v.id},page:'detail'})`,'outline small')}</div>`).join('')}</div>`}
function discover(){let vs=venues.filter(v=>(S.filter==='All'||v.type===S.filter||v.area===S.filter)&&(v.name+' '+v.area+' '+v.type).toLowerCase().includes(S.search.toLowerCase()));return `${pageHead('EXPLORE','Discover venues','หาร้านและเลือกบริการที่เหมาะกับค่ำคืนนี้') }<div class="search-row"><input class="field" id="search" value="${esc(S.search)}" placeholder="Search venues, areas, or music..." oninput="S.search=this.value;save();document.getElementById('venue-results').innerHTML=filteredCards()">${btn(ic('filter')+' Filters',"notice('เลือกประเภทจากตัวกรองด้านล่างได้เลย')",'outline')}</div><div class="chips">${['All','Club','Bar','Live Music','Lounge','Thonglor','RCA','Sukhumvit'].map(t=>`<button class="chip ${S.filter===t?'active':''}" onclick="update({filter:'${t}'})">${t}</button>`).join('')}</div><div id="venue-results" class="grid">${vs.map(venueCard).join('')||'<div class="empty">ไม่พบร้านที่ตรงกับคำค้นหา</div>'}</div><p class="fine" style="margin-top:20px">* ร้าน รูปภาพ คะแนน และราคาเป็นข้อมูลจำลองเพื่อทดสอบ UX ไม่ใช่ข้อมูลการเปิดให้บริการจริง</p>`}function filteredCards(){return venues.filter(v=>(S.filter==='All'||v.type===S.filter||v.area===S.filter)&&(v.name+' '+v.area+' '+v.type).toLowerCase().includes(S.search.toLowerCase())).map(venueCard).join('')||'<div class="empty">ไม่พบร้านที่ตรงกับคำค้นหา</div>'}
function detail(){let v=venue(S.venue),fav=S.favorites.includes(v.id);return `${pageHead('VENUE DETAIL',v.name,v.area+' · '+v.type,btn(ic('heart')+(fav?' Saved':' Save'),`toggleFav(${v.id})`,'outline small'))}<div class="detail-hero" style="background-image:url('${v.img}')"><div class="overlay-text"><span class="tag">★ ${v.rating} · ${v.live?'Live tonight':'Featured venue'}</span><h1>${v.name}</h1><span>${ic('location',15)} ${v.area}, Bangkok</span></div></div><div class="detail-columns"><div class="card pad"><h2 style="margin-top:0">About this venue</h2><p class="muted">${v.desc}</p><hr class="divider"><div class="detail-list"><div><span>Venue type</span><b>${v.type}</b></div><div><span>Area</span><b>${v.area}</b></div><div><span>Estimated table spend</span><b>From ${money(v.price)}</b></div><div><span>Upcoming event</span><b>${v.event}</b></div></div><div class="notice">ข้อมูลร้านและนโยบายที่แสดงเป็นตัวอย่าง การจองและการต่อคิวแทนต้องได้รับอนุญาตจากร้านจริงก่อนให้บริการ</div></div><div class="card pad"><div class="eyebrow">CHOOSE YOUR SERVICE</div><h2>How would you like to get in?</h2><div class="choice" onclick="update({service:'booking',page:'request'})"><b>${ic('calendar')} Book a table</b><small>ส่งคำขอจองโต๊ะล่วงหน้า และเลือกความช่วยเหลือจาก Table Runner</small></div><div class="choice" onclick="update({service:'queue',page:'request'})"><b>${ic('queue')} Get in line (Walk-in)</b><small>ส่งคำขอให้ Runner ต่อคิวแทน เฉพาะกรณีที่ร้านอนุญาต</small></div><p class="fine">ทั้งสองบริการเป็นการส่งคำขอ ไม่รับประกันว่าจะได้รับโต๊ะ</p></div></div>`}
function toggleFav(id){S.favorites=S.favorites.includes(id)?S.favorites.filter(x=>x!==id):[...S.favorites,id];save();render();notice('อัปเดตรายการโปรดแล้ว')}
function request(){let v=venue(S.venue),q=S.service==='queue';return `${pageHead('SERVICE REQUEST',q?'Get in line':'Book a table',v.name+' · '+v.area,btn(ic('back')+' Back',"nav('detail')",'outline small'))}<div class="detail-columns"><div class="card pad"><div class="stepper"><div class="step on"></div><div class="step on"></div><div class="step"></div></div><h2>Tell us your plans</h2><p class="muted">${q?'ขอความช่วยเหลือในการต่อคิว Walk-in':'ส่งคำขอช่วยจองโต๊ะล่วงหน้า'} · กรุณาระบุรายละเอียด</p><div class="form-grid"><div class="form-group"><label>Date</label><input class="field" type="date" min="${new Date().toISOString().slice(0,10)}" value="${S.date}" onchange="S.date=this.value;save()"></div><div class="form-group"><label>Preferred time</label><select class="field" onchange="S.time=this.value;save()">${['18:00','19:00','20:00','21:00','22:00','23:00','00:00'].map(x=>`<option ${S.time===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Party size</label><select class="field" onchange="S.people=Number(this.value);save()">${[1,2,3,4,5,6,7,8,10].map(x=>`<option value="${x}" ${S.people===x?'selected':''}>${x} people</option>`).join('')}</select></div><div class="form-group"><label>${q?'Estimated arrival':'Seating preference'}</label><select class="field" onchange="S.seating=this.value;save()">${(q?['Within 30 minutes','Within 1 hour','Flexible']:['Standard','VIP','Outdoor','No preference']).map(x=>`<option ${S.seating===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="form-group"><label>Special request (optional)</label><textarea id="special" class="field" rows="3" placeholder="Anything the runner or venue should know?"></textarea></div><hr class="divider"><h3>Choose a Table Runner</h3><p class="muted">ค่าบริการตัวอย่าง ไม่ใช่ราคาที่เสนอขายจริง</p>${runners.map(runnerCard).join('')}<div class="notice">${q?'การต่อคิวแทนและการส่งต่อสิทธิในคิวต้องเป็นไปตามนโยบายของร้าน':'การจองจะสำเร็จต่อเมื่อร้านยืนยันคำขอจริง'} ค่าบริการยังไม่ถูกเรียกเก็บในต้นแบบนี้</div>${btn('Review request '+ic('arrow'),"goReview()",'full')}</div><div class="card pad"><h3>Request summary</h3><div class="detail-list"><div><span>Venue</span><b>${v.name}</b></div><div><span>Service</span><b>${q?'Walk-in queue':'Advance booking'}</b></div><div><span>Table Runner</span><b>${runners.find(r=>r.id===S.runner)?.name}</b></div><div><span>Estimated runner fee</span><b>${money(runners.find(r=>r.id===S.runner)?.fee)}</b></div></div><p class="fine">Final availability, venue policy and charges must be verified before confirmation.</p></div></div>`}
function goReview(){let el=document.getElementById('special');S.special=el?.value||'';save();nav('review')}
function review(){let v=venue(S.venue),r=runners.find(x=>x.id===S.runner),q=S.service==='queue';return `${pageHead('FINAL REVIEW','Review your request','ตรวจสอบข้อมูลก่อนส่งคำขอ') }<div class="card pad" style="max-width:720px"><div class="stepper"><div class="step on"></div><div class="step on"></div><div class="step on"></div></div><div class="row"><div><div class="eyebrow">${q?'WALK-IN QUEUE':'ADVANCE BOOKING'}</div><h2>${v.name}</h2><p class="muted">${v.area} · ${S.date} at ${S.time}</p></div><img src="${v.img}" style="width:120px;height:95px;object-fit:cover;border-radius:14px" alt=""></div><hr class="divider"><div class="detail-list"><div><span>Party size</span><b>${S.people} guests</b></div><div><span>Seating / Arrival</span><b>${esc(S.seating)}</b></div><div><span>Runner</span><b>${r.name}</b></div><div><span>Illustrative runner fee</span><b>${money(r.fee)}</b></div><div><span>Special request</span><b>${esc(S.special||'—')}</b></div></div><div class="notice">การกดส่งคำขอในต้นแบบจะบันทึกข้อมูลจำลองไว้ในเบราว์เซอร์เท่านั้น ยังไม่มีการจองจริง การรับงานจริง หรือการชำระเงินจริง</div><div class="row">${btn('Edit details',"nav('request')",'outline')}${btn('Submit demo request '+ic('arrow'),"submitRequest()")}</div></div>`}
function submitRequest(){let id='CK-'+String(Date.now()).slice(-6),r={id,venue:S.venue,type:S.service,date:S.date,time:S.time,people:S.people,runner:S.runner,fee:runners.find(x=>x.id===S.runner).fee,status:0,special:S.special||'',created:new Date().toLocaleString('th-TH')};S.requests.unshift(r);S.venueRequests.unshift({...r,status:'pending'});save();nav('confirmation')}
function confirmation(){let r=currentReq();if(!r)return bookings();return `${pageHead('REQUEST SUBMITTED','Your night is in motion','คำขอตัวอย่างถูกบันทึกแล้ว') }<div class="card pad" style="max-width:680px;text-align:center"><div class="mini-visual"><img src="logo.png" alt="CHILL N KNOCK"></div><h2 style="font-family:'Playfair Display',serif;font-size:30px">Request received</h2><p class="muted">หมายเลข ${r.id} · ${venue(r.venue).name}</p><span class="tag">Demo request · Awaiting venue verification</span><div class="notice" style="text-align:left">คำขอนี้ยังไม่ใช่การยืนยันโต๊ะหรือสิทธิในคิวจริง ร้านและ Table Runner ยังไม่ได้รับคำขอจากเว็บไซต์นี้</div><div class="row" style="justify-content:center;flex-wrap:wrap">${btn('View status',"nav('tracking')")}${btn('Explore more',"nav('discover')",'outline')}</div></div>`}
function bookings(){return `${pageHead('MY BOOKINGS','My requests','ติดตามคำขอและประวัติที่สร้างในต้นแบบ')}${S.requests.length?S.requests.map(r=>`<div class="card list-card"><img src="${venue(r.venue).img}" style="width:90px;height:75px;object-fit:cover;border-radius:12px" alt=""><div class="grow"><h3>${venue(r.venue).name}</h3><p>${r.id} · ${r.type==='queue'?'Walk-in queue':'Advance booking'} · ${r.date} ${r.time}</p><span class="tag">${r.status===0?'Awaiting review':r.status===1?'Runner assigned':r.status===2?'In progress':'Completed'}</span></div>${btn('Track',`track('${r.id}')`,'small')}</div>`).join(''):`<div class="card empty">${ic('calendar',34)}<h3>No requests yet</h3><p>เริ่มต้นจากการเลือกร้านที่สนใจ</p>${btn('Explore venues',"nav('discover')")}</div>`}`}function track(id){S.trackId=id;nav('tracking')}
function tracking(){let r=S.requests.find(x=>x.id===S.trackId)||currentReq();if(!r)return bookings();let labels=r.type==='queue'?['Request submitted','Runner assigned (demo)','Runner arrived at venue','Queue position updated','Venue confirms queue transfer']:['Request submitted','Runner assigned (demo)','Runner contacts venue','Venue confirms booking','Request completed'];return `${pageHead('LIVE STATUS','Request tracking',r.id+' · '+venue(r.venue).name)}<div class="detail-columns"><div class="card pad"><h3>${r.type==='queue'?'Walk-in queue':'Advance booking'} progress</h3>${labels.map((t,i)=>`<div class="status-line ${i<=r.status?'done':''}"><span class="dot"></span><b>${t}</b><p>${i<=r.status?'Demo status recorded':'Not yet confirmed'}</p></div>`).join('')}<div class="notice">สถานะเป็นการจำลอง UX เท่านั้น ไม่ใช่ข้อมูลสดจากร้านหรือ Runner</div><div class="row" style="flex-wrap:wrap">${btn('Next demo status',`advanceStatus('${r.id}')`,'small')}${btn('Message runner',"nav('messages')",'outline small')}</div></div><div class="card pad"><h3>Venue & runner</h3><div class="mock-map">${ic('location',26)} ${venue(r.venue).area} · Demo location</div>${runnerCard(runners.find(x=>x.id===r.runner))}<div class="detail-list"><div><span>Date</span><b>${r.date}</b></div><div><span>Time</span><b>${r.time}</b></div><div><span>Party size</span><b>${r.people}</b></div></div></div></div>`}function advanceStatus(id){let r=S.requests.find(x=>x.id===id);r.status=Math.min(4,r.status+1);save();render();notice('อัปเดตสถานะจำลองแล้ว')}
function messages(){return `${pageHead('MESSAGES','Messages','พื้นที่จำลองการสนทนากับ Table Runner')}<div class="card pad" style="max-width:720px"><div class="row"><div class="runner-face">NS</div><div style="flex:1"><b>Nina S.</b><div class="muted">Demo runner chat · Not connected</div></div><span class="tag">Prototype</span></div><hr class="divider"><div class="chat" id="chat">${S.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')}</div><div class="search-row" style="margin-bottom:0"><input class="field" id="msg" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">${btn(ic('send'),"sendMessage()")}</div><p class="fine">ข้อความถูกเก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น ไม่มีผู้รับจริง</p></div>`}function sendMessage(){let el=document.getElementById('msg');let text=el?.value.trim();if(!text)return;S.messages.push({mine:true,text});save();render();let chat=document.getElementById('chat');if(chat)chat.scrollTop=chat.scrollHeight;notice('ส่งข้อความจำลองแล้ว')}
function profile(){return `${pageHead('MY ACCOUNT','Your profile','จัดการบัญชีและเปลี่ยนโหมดทดลอง') }<div class="card pad" style="max-width:760px"><div class="row"><div class="runner-face" style="width:70px;height:70px;font-size:24px">JD</div><div style="flex:1"><h2 style="margin:0">Jane Demo</h2><p class="muted">Prototype account · Bangkok</p></div>${btn('Edit',"notice('ฟีเจอร์แก้ไขโปรไฟล์เป็นตัวอย่างในต้นแบบ')",'outline small')}</div><hr class="divider"><div class="section-title">Favorites</div><div class="grid two">${S.favorites.length?S.favorites.map(id=>venueCard(venue(id))).join(''):'<p class="muted">ยังไม่มีร้านที่บันทึกไว้</p>'}</div><hr class="divider"><div class="section-title">Switch workspace</div><div class="role-intro">${['user','runner','venue'].map(r=>`<button onclick="switchRole('${r}')">${ic(r==='user'?'profile':r==='runner'?'jobs':'store',26)}<div style="margin-top:8px">${r==='user'?'Nightlife User':r==='runner'?'Table Runner':'Venue Partner'}</div></button>`).join('')}</div><p class="fine">การสลับบทบาทมีไว้เพื่อทดสอบ User Journey ของแต่ละฝั่ง</p></div>`}
function runnerHome(){let accepted=S.runnerJobs.filter(x=>x.status==='accepted');return `${pageHead('RUNNER WORKSPACE','Jobs near you','Find flexible jobs around Bangkok',btn(ic('shield')+' Demo verified',"notice('สถานะ Verified เป็นข้อมูลจำลอง')",'outline small'))}<div class="grid four"><div class="card stat"><span class="eyebrow">AVAILABLE JOBS</span><strong>${S.runnerJobs.filter(x=>x.status==='available').length}</strong><small>Ready to explore</small></div><div class="card stat"><span class="eyebrow">ACTIVE JOBS</span><strong>${accepted.length}</strong><small>In progress</small></div><div class="card stat"><span class="eyebrow">DEMO EARNINGS</span><strong>${money(S.runnerJobs.filter(x=>x.status==='done').reduce((a,x)=>a+x.fee,0))}</strong><small>Simulated only</small></div><div class="card stat"><span class="eyebrow">RATING</span><strong>4.9 ★</strong><small>Illustrative score</small></div></div><div class="section-title">Available jobs</div>${S.runnerJobs.filter(x=>x.status==='available').map(jobCard).join('')||'<div class="card empty">No available jobs</div>'}<div class="notice">งานและค่าตอบแทนเป็นข้อมูลตัวอย่าง ไม่มีการจ้างงานหรือจ่ายเงินจริง</div>`}function jobCard(j){let v=venue(j.venue);return `<div class="card list-card"><div class="service-icon">${ic(j.type==='queue'?'queue':'calendar',23)}</div><div class="grow"><h3>${v.name} <span class="tag">${j.type==='queue'?'Walk-in queue':'Advance booking'}</span></h3><p>${v.area} · ${j.people} guests · ${j.time} · ${j.id}</p></div><div><div class="price" style="text-align:right;margin-bottom:7px">${money(j.fee)}</div>${btn('View job',`update({jobId:'${j.id}',page:'job-detail'})`,'small')}</div></div>`}function runnerJobs(){return `${pageHead('JOB BOARD','Available jobs','เลือกงานตามพื้นที่ เวลา และประเภทบริการ')}${S.runnerJobs.filter(x=>x.status==='available').map(jobCard).join('')||'<div class="card empty">ไม่มีงานที่เปิดอยู่ในต้นแบบ</div>'}`}
function jobDetail(){let j=S.runnerJobs.find(x=>x.id===S.jobId)||S.runnerJobs[0],v=venue(j.venue);return `${pageHead('JOB DETAIL',j.type==='queue'?'Walk-in Queue Helper':'Advance Booking Helper',j.id+' · '+v.area,btn(ic('back')+' Jobs',"nav('jobs')",'outline small'))}<div class="detail-columns"><div class="card pad"><img src="${v.img}" style="width:100%;height:210px;object-fit:cover;border-radius:15px" alt=""><h2>${v.name}</h2><div class="detail-list"><div><span>Job type</span><b>${j.type==='queue'?'Queue at venue':'Contact venue for booking'}</b></div><div><span>Party size</span><b>${j.people} guests</b></div><div><span>Target time</span><b>${j.time}</b></div><div><span>Illustrative fee</span><b>${money(j.fee)}</b></div></div><div class="notice">ตรวจสอบนโยบายร้านก่อนรับงาน โดยเฉพาะสิทธิการต่อคิวแทนลูกค้าและการส่งต่อคิว</div>${btn('Accept demo job',`acceptJob('${j.id}')`,'full '+(j.status==='available'?'':'outline'))}</div><div class="card pad"><h3>Before accepting</h3><p class="muted">Checklist สำหรับผู้รับงาน</p><div class="detail-list"><div><span>Venue allows this service</span><b>Needs verification</b></div><div><span>Customer identity</span><b>Demo verified</b></div><div><span>Compensation</span><b>Illustrative</b></div><div><span>Travel expense</span><b>Not included</b></div></div></div></div>`}function acceptJob(id){let j=S.runnerJobs.find(x=>x.id===id);j.status='accepted';j.progress=0;save();nav('active');notice('รับงานจำลองแล้ว')}
function runnerActive(){let jobs=S.runnerJobs.filter(x=>x.status==='accepted');return `${pageHead('ACTIVE WORK','Active jobs','อัปเดตสถานะงานให้ลูกค้าและร้านรับทราบ')}${jobs.length?jobs.map(j=>`<div class="card pad" style="margin-bottom:16px"><div class="row"><div><span class="tag">${j.id}</span><h2>${venue(j.venue).name}</h2><p class="muted">${j.type==='queue'?'Walk-in queue':'Advance booking'} · ${j.people} guests</p></div><strong class="price">${money(j.fee)}</strong></div><hr class="divider">${(j.type==='queue'?['Job accepted','Arrived at venue','Started queue','Queue position updated','Venue confirmed handover']:['Job accepted','Contacted venue','Sent booking details','Venue confirmed','Proof submitted']).map((x,i)=>`<div class="status-line ${i<=j.progress?'done':''}"><span class="dot"></span><b>${x}</b></div>`).join('')}<div class="row" style="flex-wrap:wrap">${btn('Update progress',`runnerProgress('${j.id}')`,'small')}${btn('Upload proof (demo)',`runnerProof('${j.id}')`,'outline small')}${btn('Complete job',`completeJob('${j.id}')`,'dark small')}</div></div>`).join(''):'<div class="card empty">ยังไม่มีงานที่กำลังดำเนินการ</div>'}`}function runnerProgress(id){let j=S.runnerJobs.find(x=>x.id===id);j.progress=Math.min(4,(j.progress||0)+1);save();render();notice('บันทึกความคืบหน้าจำลองแล้ว')}function runnerProof(id){notice('ต้นแบบนี้จำลองการแนบหลักฐาน ยังไม่มีระบบอัปโหลดไฟล์จริง')}function completeJob(id){let j=S.runnerJobs.find(x=>x.id===id);j.status='done';save();nav('earnings');notice('ปิดงานจำลองเรียบร้อย')}
function earnings(){let done=S.runnerJobs.filter(x=>x.status==='done'),sum=done.reduce((a,j)=>a+j.fee,0);return `${pageHead('RUNNER FINANCE','Earnings','สรุปรายได้จำลองจากงานที่ปิดแล้ว')}<div class="grid two"><div class="card stat"><span class="eyebrow">TOTAL DEMO EARNINGS</span><strong>${money(sum)}</strong><small>No real payment processed</small></div><div class="card stat"><span class="eyebrow">COMPLETED JOBS</span><strong>${done.length}</strong><small>In this browser</small></div></div><div class="section-title">Completed jobs</div>${done.map(j=>jobCard(j)).join('')||'<div class="card empty">ยังไม่มีงานที่ปิดแล้ว</div>'}`}
function runnerProfile(){return `${pageHead('RUNNER ACCOUNT','Runner profile','ข้อมูลและการตั้งค่าตัวอย่าง')}<div class="card pad" style="max-width:700px"><div class="row"><div class="runner-face" style="height:70px;width:70px;font-size:24px">NS</div><div style="flex:1"><h2>Nina S.</h2><p class="muted">Table Runner · Demo profile</p></div><span class="tag">Verified (demo)</span></div><hr class="divider"><div class="detail-list"><div><span>Preferred area</span><b>RCA, Thonglor</b></div><div><span>Availability</span><b>Evenings</b></div><div><span>Completed jobs</span><b>${S.runnerJobs.filter(x=>x.status==='done').length}</b></div></div><div class="notice">การยืนยันตัวตนและบัญชีธนาคารยังไม่ได้เชื่อมต่อจริง</div>${btn('Switch to nightlife user',"switchRole('user')",'outline')}</div>`}
function venueHome(){let pending=S.venueRequests.filter(x=>x.status==='pending').length;return `${pageHead('VENUE PARTNER','Venue dashboard','${esc(S.venueName)} · Booking & queue management')}<div class="grid four"><div class="card stat"><span class="eyebrow">BOOKING REQUESTS</span><strong>${S.venueRequests.length}</strong><small>Demo requests</small></div><div class="card stat"><span class="eyebrow">PENDING</span><strong>${pending}</strong><small>Need review</small></div><div class="card stat"><span class="eyebrow">QUEUE</span><strong>${S.venueQueue.length}</strong><small>Current demo entries</small></div><div class="card stat"><span class="eyebrow">RUNNER CHECK-INS</span><strong>${S.venueRequests.filter(x=>x.status==='confirmed').length}</strong><small>Illustrative</small></div></div><div class="section-title">Needs your attention</div><div class="grid two"><div class="card service-card"><div class="service-icon">${ic('bookings',24)}</div><h3>Booking requests</h3><p>ตรวจสอบคำขอและยืนยันเฉพาะรายการที่ร้านรับได้จริง</p>${btn('Manage requests',"nav('venue-bookings')",'small')}</div><div class="card service-card"><div class="service-icon">${ic('queue',24)}</div><h3>Queue management</h3><p>จัดการคิว Walk-in และกำหนดกฎการต่อคิวแทน</p>${btn('Open queue',"nav('venue-queue')",'small')}</div></div><div class="notice">Venue Partner เป็นแดชบอร์ดจำลองเพื่อใช้ทดสอบขั้นตอนและเงื่อนไขของร้าน ยังไม่มีการเชื่อมต่อสถานประกอบการจริง</div>`}
function venueBookings(){return `${pageHead('VENUE OPERATIONS','Booking requests','ตรวจสอบและตอบรับคำขอจากผู้ใช้')}${S.venueRequests.length?S.venueRequests.map(r=>`<div class="card list-card"><div class="service-icon">${ic(r.type==='queue'?'queue':'calendar',22)}</div><div class="grow"><h3>${r.id} · ${venue(r.venue).name}</h3><p>${r.type==='queue'?'Walk-in queue':'Advance booking'} · ${r.date} ${r.time} · ${r.people} guests</p><span class="tag">${r.status}</span></div>${r.status==='pending'?`<div style="display:flex;gap:7px;flex-wrap:wrap">${btn('Confirm',`venueDecision('${r.id}','confirmed')`,'small')}${btn('Decline',`venueDecision('${r.id}','declined')`,'outline small')}</div>`:''}</div>`).join(''):'<div class="card empty">ยังไม่มีคำขอในต้นแบบ ลองสร้างคำขอจากโหมด Nightlife User</div>'}`}function venueDecision(id,status){let r=S.venueRequests.find(x=>x.id===id);r.status=status;save();render();notice(status==='confirmed'?'บันทึกการยืนยันจำลองแล้ว':'บันทึกการปฏิเสธจำลองแล้ว')}
function venueQueue(){return `${pageHead('QUEUE MANAGEMENT','Walk-in queue','จัดการคิวหน้าร้านและการเช็กอิน') }<div class="card pad"><div class="row"><div><h3 style="margin:0">Current queue (${S.venueQueue.length})</h3><p class="muted">เพิ่มรายการจำลองเพื่อทดสอบการจัดการคิว</p></div>${btn(ic('plus')+' Add guest',"addQueue()")}</div><hr class="divider">${S.venueQueue.length?S.venueQueue.map((q,i)=>`<div class="list-card" style="padding:12px 0;border-bottom:1px solid var(--line)"><span class="runner-face">${i+1}</span><div class="grow"><h3>${esc(q.name)}</h3><p>${q.people} guests · ${q.status}</p></div>${btn('Call',`queueStatus(${q.id},'Called')`,'outline small')}${btn('Seat',`queueStatus(${q.id},'Seated')`,'small')}</div>`).join(''):'<div class="empty">ยังไม่มีรายการคิวจำลอง</div>'}<div class="notice">การโอนสิทธิในคิวขึ้นอยู่กับนโยบายร้าน ต้องไม่ถือว่าผู้รับงานมีสิทธิโอนคิวได้โดยอัตโนมัติ</div></div>`}function addQueue(){let name=prompt('Guest name (demo)','Walk-in guest');if(!name)return;S.venueQueue.push({id:Date.now(),name,people:2,status:'Waiting'});save();render()}function queueStatus(id,status){let q=S.venueQueue.find(x=>x.id===id);q.status=status;save();render()}
function venueSettings(){return `${pageHead('VENUE POLICIES','Service settings','กำหนดเงื่อนไขที่ร้านอนุญาตให้ดำเนินการ') }<div class="card pad" style="max-width:800px"><h2>Table Runner permissions</h2><p class="muted">การตั้งค่านี้เป็นการจำลองฝั่งร้าน เพื่อทดสอบว่าต้องตรวจสอบเงื่อนไขอะไรบ้าง</p>${[['booking','Allow advance booking assistance','ให้บุคคลอื่นช่วยติดต่อจองโต๊ะล่วงหน้า'],['queue','Allow walk-in queue assistance','อนุญาตให้บุคคลอื่นมาต่อคิวแทน'],['transfer','Allow queue right transfer','อนุญาตให้ส่งต่อสิทธิในคิวแก่ลูกค้า']].map(([key,title,desc])=>`<div class="row" style="padding:18px 0;border-bottom:1px solid var(--line)"><div><b>${title}</b><div class="muted">${desc}</div></div><input type="checkbox" ${S.venuePolicy[key]?'checked':''} onchange="S.venuePolicy.${key}=this.checked;save();notice('บันทึกนโยบายจำลองแล้ว')" style="width:22px;height:22px;accent-color:var(--wine)"></div>`).join('')}<div class="form-group"><label>Venue-specific conditions</label><textarea class="field" rows="4" id="policyNote" placeholder="เช่น ต้องมีผู้จองมาแสดงตัวก่อนเวลา...">${esc(S.policyNote||'')}</textarea></div>${btn('Save demo policy',"savePolicy()") }<div class="notice">ข้อกำหนดนี้ยังไม่ใช่นโยบายของร้านจริง และไม่ได้ทำให้คำขอของ Nightlife User ได้รับการยืนยันโดยอัตโนมัติ</div></div>`}function savePolicy(){S.policyNote=document.getElementById('policyNote').value;save();notice('บันทึกเงื่อนไขจำลองแล้ว')}
function venueAnalytics(){let total=S.venueRequests.length;return `${pageHead('INSIGHTS','Venue analytics','ข้อมูลสรุปจากการทดลองในเบราว์เซอร์นี้') }<div class="grid three"><div class="card stat"><span class="eyebrow">TOTAL REQUESTS</span><strong>${total}</strong><small>Demo only</small></div><div class="card stat"><span class="eyebrow">CONFIRMED</span><strong>${S.venueRequests.filter(x=>x.status==='confirmed').length}</strong><small>Demo confirmations</small></div><div class="card stat"><span class="eyebrow">DECLINED</span><strong>${S.venueRequests.filter(x=>x.status==='declined').length}</strong><small>Demo declines</small></div></div><div class="card pad" style="margin-top:20px"><h3>Request breakdown</h3><div class="detail-list"><div><span>Advance booking</span><b>${S.venueRequests.filter(x=>x.type==='booking').length}</b></div><div><span>Walk-in queue</span><b>${S.venueRequests.filter(x=>x.type==='queue').length}</b></div></div><p class="fine">ไม่มีข้อมูลผู้ใช้จริงหรือระบบ Analytics ภายนอก</p></div>`}
const menus={user:[['home','Home','home'],['discover','Discover','discover'],['bookings','My requests','bookings'],['messages','Messages','messages'],['profile','Profile','profile']],runner:[['home','Overview','dashboard'],['jobs','Available jobs','jobs'],['active','Active jobs','active'],['earnings','Earnings','earnings'],['profile','Profile','profile']],venue:[['home','Dashboard','dashboard'],['venue-bookings','Bookings','bookings'],['venue-queue','Queue','queue'],['venue-settings','Policies','settings'],['venue-analytics','Analytics','earnings']]};function switchRole(role){S.role=role;S.page='home';save();render();window.scrollTo(0,0)}function page(){if(S.role==='user')return ({home:userHome,discover,detail,request,review,confirmation,bookings,tracking,messages,profile})[S.page]?.()||userHome();if(S.role==='runner')return ({home:runnerHome,jobs:runnerJobs,'job-detail':jobDetail,active:runnerActive,earnings,profile:runnerProfile})[S.page]?.()||runnerHome();return ({home:venueHome,'venue-bookings':venueBookings,'venue-queue':venueQueue,'venue-settings':venueSettings,'venue-analytics':venueAnalytics})[S.page]?.()||venueHome()}
function render(){let m=menus[S.role],roleName={user:'Nightlife User',runner:'Table Runner',venue:'Venue Partner'}[S.role];document.getElementById('app').innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="brand"><img src="logo.png" alt="CHILL N KNOCK logo"><div><b>CHILL N’<br>KNOCK</b><small>GOOD NIGHTS, LESS WAIT.</small></div></div><div class="role-caption">${roleName} workspace</div>${m.map(([id,label,icon])=>`<button class="side-link ${S.page===id?'active':''}" onclick="nav('${id}')">${ic(icon,20)} ${label}</button>`).join('')}<div class="side-bottom"><div class="role-caption">Preview other roles</div>${['user','runner','venue'].filter(r=>r!==S.role).map(r=>`<button class="side-link" onclick="switchRole('${r}')">${ic('arrow')} ${r==='user'?'Nightlife User':r==='runner'?'Table Runner':'Venue Partner'}</button>`).join('')}<div class="fine" style="padding:18px 10px;color:#c9a8aa">Interactive UX prototype · Demo data only</div></div></aside><div class="workspace"><header class="topbar"><div class="crumb"><strong>CHILL N’ KNOCK</strong> / ${roleName}</div><div class="top-actions"><select class="role-select" aria-label="Switch role" onchange="switchRole(this.value)"><option value="user" ${S.role==='user'?'selected':''}>Nightlife User</option><option value="runner" ${S.role==='runner'?'selected':''}>Table Runner</option><option value="venue" ${S.role==='venue'?'selected':''}>Venue Partner</option></select><div class="avatar">${S.role==='venue'?'VP':S.role==='runner'?'NS':'JD'}</div></div></header><main class="content">${page()}</main></div></div><nav class="bottom-nav">${m.map(([id,label,icon])=>`<button class="${S.page===id?'active':''}" onclick="nav('${id}')">${ic(icon,22)}<span>${label.replace('Available ','').replace('My ','')}</span></button>`).join('')}</nav>`}render();
</script></body></html>
